version: 2

# ── Update policy ────────────────────────────────────────────────────────────
# Only major-version bumps are surfaced as PRs. Patch and minor version updates
# are ignored across every ecosystem via the wildcard ignore rule below.
# Note: this does NOT suppress Dependabot *security* updates — those still open
# regardless of update-type, which is the behaviour we want.

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]

  # ── Rust (drs-core) ──────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/drs-core"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]

  # ── TypeScript SDK (drs-sdk) ─────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/drs-sdk"
    schedule:
      interval: "weekly"
    ignore:
      # vite and esbuild are transitive deps of vitest@1.x — they cannot be
      # bumped past what vitest allows without upgrading vitest itself first.
      - dependency-name: "vite"
      - dependency-name: "esbuild"
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]

  # ── MCP client ───────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/packages/drs-mcp-client"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "vite"
      - dependency-name: "esbuild"
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]

  # ── MCP server ───────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/packages/drs-mcp-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "vite"
      - dependency-name: "esbuild"
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]

  # ── Integration tests ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/integration-tests"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]

  # ── Expense agent example ────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/examples/drs-expense-agent"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]
