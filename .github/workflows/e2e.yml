name: E2E Integration Tests

# Runs the integration-tests/ suite against a locally-built Docker image
# on every PR, and against the currently-tagged image after publish.
# The published-artifact run is the one that catches drift between the
# source tree and the shipped container.
#
# Security note: github.ref_name on tag events is a tag string, not user
# input from an issue/PR body. We still funnel it through `env:` before
# using it in run: shell, which is the safe pattern for any expression.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-local-build:
    name: E2E against locally-built image (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build drs-verify image
        uses: docker/build-push-action@v7
        with:
          context: drs-verify
          file: drs-verify/Dockerfile
          tags: drs-verify:pr-test
          load: true
          push: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages used by E2E
        run: pnpm --filter @okeyamy/drs-sdk --filter @drs/mcp-server build

      - name: Run E2E
        working-directory: integration-tests
        env:
          DRS_VERIFY_IMAGE: drs-verify:pr-test
        run: ./run.sh

  e2e-published-image:
    name: E2E against published image (post-tag smoke test)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages used by E2E
        run: pnpm --filter @okeyamy/drs-sdk --filter @drs/mcp-server build

      - name: Wait for published image to be available
        # publish.yml runs concurrently: it must complete test + multi-arch
        # build + Trivy before pushing. That takes 5-15 min. Poll until the
        # tagged image is pullable rather than sleeping a fixed interval.
        env:
          TAG: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${REPO_OWNER}/drs-verify:${TAG}"
          echo "Waiting for $IMAGE ..."
          for i in $(seq 1 30); do
            if docker pull "$IMAGE" > /dev/null 2>&1; then
              echo "Image available after attempt $i"
              exit 0
            fi
            echo "Attempt $i/30: not yet available, retrying in 30 s"
            sleep 30
          done
          echo "Image not available after 15 minutes — aborting"
          exit 1

      - name: Run E2E against the published image
        working-directory: integration-tests
        env:
          # Bound via env: (not inlined in run:) to follow the safe pattern
          # for any ${{ }} expression — even ones that look innocuous today.
          TAG: ${{ github.ref_name }}
        run: DRS_VERIFY_TAG="$TAG" ./run.sh
